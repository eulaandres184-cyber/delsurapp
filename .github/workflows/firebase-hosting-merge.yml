name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and build when Node project exists
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json/package-lock.json found; skipping npm build step."
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DELSUREVENTOS }}
          channelId: live
          projectId: delsureventos
